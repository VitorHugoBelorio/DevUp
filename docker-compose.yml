services:
  postgres:
    image: postgres:16-alpine
    container_name: devup-postgres
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 100
    shm_size: 64mb
    environment:
      POSTGRES_DB: devup
      POSTGRES_USER: devup
      POSTGRES_PASSWORD: devup
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - devup-postgres-data:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - max_connections=30
      - -c
      - shared_buffers=96MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=48MB
      - -c
      - effective_cache_size=256MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devup -d devup"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  devup-postgres-data:
